<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geolocalizador Campo</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
      --primary: #3b82f6; --success: #22c55e; --danger: #ef4444;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg); color: var(--text);
      margin: 0; padding: 1rem; display: flex; flex-direction: column; align-items: center;
    }
    .container { width: 100%; max-width: 420px; }
    .card { background: var(--card); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid #334155; }
    h2 { margin-top: 0; font-size: 1.2rem; color: #94a3b8; }
    .btn {
      width: 100%; padding: 0.85rem; border: none; border-radius: 8px; font-weight: bold;
      font-size: 1rem; cursor: pointer; background: var(--primary); color: white; margin-top: 0.5rem;
    }
    .btn-success { background: var(--success); }
    .status-badge { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
    .online { background: #166534; color: #4ade80; }
    .offline { background: #991b1b; color: #fca5a5; }
    #previewImg { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-top: 0.5rem; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1rem;">
      <h1 style="font-size: 1.4rem; margin:0;">Geolocalizador</h1>
      <span id="netStatus" class="status-badge online">ONLINE</span>
    </div>

    <!-- Fotografía -->
    <div class="card">
      <h2>1. Fotografía de Campo</h2>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
      <button class="btn" onclick="document.getElementById('cameraInput').click()">📷 Tomar Foto</button>
      <img id="previewImg" alt="Vista previa">
      <div id="imgCompressStatus" style="font-size:0.75rem; color:#38bdf8; margin-top:4px;"></div>
    </div>

    <!-- GPS -->
    <div class="card">
      <h2>2. Coordenadas GPS</h2>
      <div id="gpsStatus" style="font-size:0.9rem; color:#94a3b8;">Obteniendo ubicación...</div>
    </div>

    <!-- Log Diagnóstico -->
    <div id="debugLog" style="background:#0f172a; color:#38bdf8; font-family:monospace; font-size:11px; padding:10px; border-radius:6px; max-height:120px; overflow-y:auto; margin-bottom:10px; text-align:left;">
      > Estado: Esperando acción...
    </div>

    <!-- Enviar / Guardar -->
    <button class="btn btn-success" id="btnSave" onclick="guardarRegistro()">💾 Registrar Ubicación</button>
    
    <div id="pendingCount" style="text-align:center; margin-top:1rem; font-size:0.85rem; color:#94a3b8;">
      Pendientes de envío local: <b id="offlineCount">0</b>
    </div>
  </div>

<script>
    const URL_BACKEND = "https://script.google.com/macros/s/AKfycbzB5KNr4-YSPDfqbVIbR4joN9Vw5gzpRXfpVAEdXjPJ_DT-x6l7P3ovJeeUCSMsrEyS/exec";

    let fotoBase64 = "";
    let coordsActuales = null;
    let db;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log("Service Worker Activo"))
        .catch(err => console.error("Error SW:", err));
    }

    const request = indexedDB.open("GeolocalizadorDB", 1);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("registros")) {
        db.createObjectStore("registros", { keyPath: "id" });
      }
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      actualizarContadorOffline();
      if (navigator.onLine) sincronizarPendientes();
    };

    function updateOnlineStatus() {
      const netStatus = document.getElementById('netStatus');
      if (navigator.onLine) {
        netStatus.textContent = "ONLINE";
        netStatus.className = "status-badge online";
        sincronizarPendientes();
      } else {
        netStatus.textContent = "OFFLINE";
        netStatus.className = "status-badge offline";
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    // Compresión y optimización de fotos en cliente
    document.getElementById('cameraInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 1280;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxDim) { height *= maxDim / width; width = maxDim; }
          } else {
            if (height > maxDim) { width *= maxDim / height; height = maxDim; }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // Calidad JPEG al 70%
          fotoBase64 = canvas.toDataURL('image/jpeg', 0.70);

          const prev = document.getElementById('previewImg');
          prev.src = fotoBase64;
          prev.style.display = 'block';

          const originalKB = (file.size / 1024).toFixed(0);
          const compressedKB = (fotoBase64.length * 0.75 / 1024).toFixed(0);
          document.getElementById('imgCompressStatus').textContent = 
            `Imagen optimizada: ${originalKB}KB ➔ ${compressedKB}KB`;
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (pos) => {
          coordsActuales = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            precision: pos.coords.accuracy
          };
          document.getElementById('gpsStatus').innerHTML = `
            Lat: ${coordsActuales.lat.toFixed(5)}<br>
            Lng: ${coordsActuales.lng.toFixed(5)}<br>
            Precisión: ±${coordsActuales.precision.toFixed(1)}m
          `;
        },
        (err) => {
          document.getElementById('gpsStatus').textContent = "Error GPS: " + err.message;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }
     
    function guardarRegistro() {
      if (!coordsActuales) {
        alert("Aún no se ha obtenido la ubicación GPS.");
        return;
      }

      const ahora = new Date();
      const timestampLocal = ahora.getFullYear() + '-' +
        String(ahora.getMonth() + 1).padStart(2, '0') + '-' +
        String(ahora.getDate()).padStart(2, '0') + ' ' +
        String(ahora.getHours()).padStart(2, '0') + ':' +
        String(ahora.getMinutes()).padStart(2, '0') + ':' +
        String(ahora.getSeconds()).padStart(2, '0');

      const nuevoRegistro = {
        id: 'REG-' + Date.now(),
        timestamp_captura: timestampLocal,
        latitud: coordsActuales.lat,
        longitud: coordsActuales.lng,
        precision_m: coordsActuales.precision,
        foto_base64: fotoBase64
      };

      if (navigator.onLine && URL_BACKEND && !URL_BACKEND.includes("AQUI_TU")) {
        enviarAlServidor(nuevoRegistro, false);
      } else {
        guardarEnIndexedDB(nuevoRegistro);
      }
    }

    function guardarEnIndexedDB(registro) {
      if (!db) return;
      const tx = db.transaction(["registros"], "readwrite");
      const store = tx.objectStore("registros");
      store.add(registro);
      tx.oncomplete = () => {
        alert("Registro guardado en el teléfono (Offline)");
        limpiarFormulario();
        actualizarContadorOffline();
      };
    }

    function logDebug(msg) {
      const logDiv = document.getElementById('debugLog');
      if (logDiv) {
        logDiv.innerHTML += "<br>> " + msg;
        logDiv.scrollTop = logDiv.scrollHeight;
      }
      console.log(msg);
    }

    function enviarAlServidor(registro, esSincronizacion = false) {
      logDebug("Enviando registro: " + registro.id);

      const formData = new URLSearchParams();
      formData.append("id", registro.id || ('REG-' + Date.now()));
      formData.append("timestamp_captura", registro.timestamp_captura || '');
      formData.append("latitud", registro.latitud || 0);
      formData.append("longitud", registro.longitud || 0);
      formData.append("precision_m", registro.precision_m || 0);
      formData.append("foto_base64", registro.foto_base64 || '');

      fetch(URL_BACKEND, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData.toString()
      })
      .then(() => {
        logDebug("¡Petición enviada con éxito!");
        if (esSincronizacion) {
          eliminarDeIndexedDB(registro.id);
        } else {
          alert("¡Registro enviado con éxito!");
          limpiarFormulario();
        }
      })
      .catch((err) => {
        logDebug("ERROR FETCH: " + err.message);
        if (!esSincronizacion) guardarEnIndexedDB(registro);
      });
    }

    function eliminarDeIndexedDB(id) {
      if (!db) return;
      const tx = db.transaction(["registros"], "readwrite");
      tx.objectStore("registros").delete(id);
      tx.oncomplete = () => actualizarContadorOffline();
    }

    function limpiarFormulario() {
      fotoBase64 = "";
      document.getElementById('previewImg').style.display = 'none';
      document.getElementById('cameraInput').value = "";
      document.getElementById('imgCompressStatus').textContent = "";
    }

    function actualizarContadorOffline() {
      if (!db) return;
      const tx = db.transaction(["registros"], "readonly");
      const countReq = tx.objectStore("registros").count();
      countReq.onsuccess = () => {
        document.getElementById('offlineCount').textContent = countReq.result;
      };
    }

    function sincronizarPendientes() {
      if (!db || !navigator.onLine || !URL_BACKEND || URL_BACKEND.includes("AQUI_TU")) return;
      const tx = db.transaction(["registros"], "readonly");
      const getAllReq = tx.objectStore("registros").getAll();
      getAllReq.onsuccess = () => {
        const pendientes = getAllReq.result;
        if (!pendientes || pendientes.length === 0) return;
        pendientes.forEach((reg, index) => {
          setTimeout(() => enviarAlServidor(reg, true), index * 500);
        });
      };
    }
  </script>
</body>
</html>
