<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER-MAP // GEO DASHBOARD</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --bg: #050b14;
      --card: #0a1728;
      --accent: #00ff66;
      --accent-dim: #00aa44;
      --text: #00ffcc;
      --text-muted: #338877;
      --border: #00ff6644;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }

    /* Modal / Formulario de Login Cyberpunk */
    #loginOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 11, 20, 0.95);
      z-index: 9999; display: flex; justify-content: center; align-items: center;
      backdrop-filter: blur(8px);
    }
    .login-box {
      background: var(--card); border: 2px solid var(--accent);
      border-radius: 8px; padding: 2rem; width: 340px;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.3); text-align: center;
    }
    .login-box h2 { font-size: 1.2rem; margin-top: 0; text-shadow: 0 0 10px var(--accent); }
    .input-field {
      width: 100%; padding: 0.75rem; margin-bottom: 1rem;
      background: #02060d; border: 1px solid var(--border);
      color: var(--accent); font-family: inherit; font-size: 0.9rem;
      border-radius: 4px; outline: none;
    }
    .input-field:focus { border-color: var(--accent); box-shadow: 0 0 8px var(--accent-dim); }
    .btn-cyber {
      width: 100%; padding: 0.75rem; background: var(--accent);
      color: var(--bg); border: none; font-weight: bold;
      font-family: inherit; font-size: 1rem; cursor: pointer;
      transition: 0.2s; border-radius: 4px;
    }
    .btn-cyber:hover { background: #33ff88; box-shadow: 0 0 15px var(--accent); }
    #loginError { color: var(--danger); font-size: 0.8rem; margin-top: 0.8rem; display: none; }

    header {
      background: var(--card); border-bottom: 2px solid var(--accent);
      padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
    }
    h1 { margin: 0; font-size: 1.2rem; letter-spacing: 2px; text-shadow: 0 0 8px var(--accent); }
    .status-panel { font-size: 0.8rem; color: var(--accent); display: flex; align-items: center; gap: 10px; }
    
    .main-container { display: flex; flex: 1; height: calc(100vh - 60px); overflow: hidden; }
    
    .sidebar {
      width: 380px; background: var(--card); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .sidebar-header {
      padding: 1rem; border-bottom: 1px solid var(--border);
      background: rgba(0,255,102,0.05); display: flex; justify-content: space-between; align-items: center;
    }
    .record-card {
      padding: 0.85rem 1rem; border-bottom: 1px solid #00ff6611;
      cursor: pointer; transition: all 0.2s;
    }
    .record-card:hover, .record-card.active {
      background: rgba(0, 255, 102, 0.15); border-left: 4px solid var(--accent);
    }
    .record-id { font-weight: bold; color: var(--accent); font-size: 0.9rem; }
    .record-time { font-size: 0.75rem; color: var(--text-muted); }
    .record-coords { font-size: 0.8rem; margin-top: 4px; color: #aaffdd; }

    .content-area { flex: 1; display: flex; flex-direction: column; position: relative; }
    #map { flex: 1; width: 100%; height: 100%; background: #000; }

    .dark-map-layer { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }

    .photo-panel {
      position: absolute; top: 15px; right: 15px; z-index: 1000;
      width: 320px; background: rgba(10, 23, 40, 0.92); border: 1px solid var(--accent);
      border-radius: 8px; padding: 10px; backdrop-filter: blur(5px);
      box-shadow: 0 0 20px rgba(0,0,0,0.8); display: none;
    }
    .photo-panel img {
      width: 100%; height: 200px; object-fit: cover;
      border-radius: 4px; border: 1px solid var(--border);
    }
    .btn-refresh {
      background: transparent; border: 1px solid var(--accent);
      color: var(--accent); padding: 4px 10px; cursor: pointer;
      font-family: inherit; font-size: 0.8rem; transition: 0.2s;
    }
    .btn-refresh:hover { background: var(--accent); color: var(--bg); }

    .leaflet-control-layers {
      background: var(--card) !important; color: var(--accent) !important;
      border: 1px solid var(--accent) !important; font-family: 'Courier New', Courier, monospace !important;
    }

    @media (max-width: 768px) {
      .main-container { flex-direction: column-reverse; }
      .sidebar { width: 100%; height: 40%; }
      .content-area { height: 60%; }
      .photo-panel { width: 220px; top: 5px; right: 5px; }
      .photo-panel img { height: 120px; }
    }
  </style>
</head>
<body>

  <!-- Overlay de Autenticación -->
  <div id="loginOverlay">
    <div class="login-box">
      <h2>[RESTRICTED ACCESS]</h2>
      <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom:1.5rem;">INGRESE SUS CREDENCIALES</p>
      <input type="text" id="userInput" class="input-field" placeholder="USUARIO" autocomplete="off">
      <input type="password" id="passInput" class="input-field" placeholder="CONTRASEÑA">
      <button class="btn-cyber" onclick="iniciarSesion()">INICIAR SESIÓN</button>
      <div id="loginError">ACCESO DENEGADO</div>
    </div>
  </div>

  <header>
    <h1>[SYS://GEO_TRACKER_V1]</h1>
    <div class="status-panel">
      STATUS: <span id="sysStatus">BLOQUEADO</span>
      <button class="btn-refresh" onclick="cargarDatos()">↻ REFRESH</button>
      <button class="btn-refresh" onclick="cerrarSesion()" style="border-color:var(--danger); color:var(--danger);">[LOGOUT]</button>
    </div>
  </header>

  <div class="main-container">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>REGISTROS EN BASE DE DATOS</span>
        <b id="totalCount" style="color:var(--accent);">0</b>
      </div>
      <div id="recordsList"></div>
    </div>

    <div class="content-area">
      <div id="map"></div>

      <div class="photo-panel" id="photoPanel">
        <div style="display:flex; justify-content:space-between; margin-bottom: 6px;">
          <span style="font-size:0.8rem; color:var(--accent);" id="photoTitle">FOTO CAPTURADA</span>
          <span style="cursor:pointer; color:var(--accent);" onclick="cerrarFoto()">[X]</span>
        </div>
        <img id="photoImg" src="" alt="Vista previa de campo">
        <a id="photoLink" href="#" target="_blank" style="display:block; font-size:0.75rem; color:var(--accent); margin-top:6px; text-decoration:none;">↗ Abrir en Google Drive</a>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const URL_BACKEND = "https://script.google.com/macros/s/AKfycbzB5KNr4-YSPDfqbVIbR4joN9Vw5gzpRXfpVAEdXjPJ_DT-x6l7P3ovJeeUCSMsrEyS/exec";

    let map, markersGroup;
    let registrosData = [];

    function initMap() {
      map = L.map('map').setView([25.4200, -101.0255], 13);

      const googleCyber = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        className: 'dark-map-layer', attribution: '&copy; Google Maps', maxZoom: 20
      });
      const googleSatellite = L.tileLayer('https://mt1.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
        attribution: '&copy; Google Maps', maxZoom: 20
      });
      const googleNormal = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        attribution: '&copy; Google Maps', maxZoom: 20
      });

      googleCyber.addTo(map);

      L.control.layers({
        "Google Cyber (Dark)": googleCyber,
        "Google Satélite": googleSatellite,
        "Google Calles": googleNormal
      }, null, { position: 'topright' }).addTo(map);

      markersGroup = L.layerGroup().addTo(map);
    }

    function iniciarSesion() {
      const u = document.getElementById('userInput').value;
      const p = document.getElementById('passInput').value;
      
      if (!u || !p) return;

      sessionStorage.setItem('geo_user', u);
      sessionStorage.setItem('geo_pass', p);

      cargarDatos();
    }

    function cerrarSesion() {
      sessionStorage.removeItem('geo_user');
      sessionStorage.removeItem('geo_pass');
      document.getElementById('loginOverlay').style.display = 'flex';
      document.getElementById('sysStatus').textContent = "BLOQUEADO";
      registrosData = [];
      renderizarLista();
      if (markersGroup) markersGroup.clearLayers();
    }

    function cargarDatos() {
      const user = sessionStorage.getItem('geo_user');
      const pass = sessionStorage.getItem('geo_pass');

      if (!user || !pass) {
        document.getElementById('loginOverlay').style.display = 'flex';
        return;
      }

      document.getElementById('sysStatus').textContent = "AUTENTICANDO...";
      document.getElementById('loginError').style.display = 'none';

      const fetchUrl = `${URL_BACKEND}?user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`;

      fetch(fetchUrl)
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success') {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('sysStatus').textContent = "ONLINE";
            registrosData = res.data;
            document.getElementById('totalCount').textContent = registrosData.length;
            renderizarLista();
            renderizarMapa();
          } else {
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('loginError').style.display = 'block';
            document.getElementById('sysStatus').textContent = "DENEGADO";
          }
        })
        .catch(err => {
          console.error(err);
          document.getElementById('sysStatus').textContent = "ERROR_CONEXION";
        });
    }

    function normalizarCoordenada(val) {
      if (typeof val === 'number') return val;
      if (!val) return 0;
      let str = val.toString().replace(',', '.');
      return parseFloat(str);
    }

    function renderizarLista() {
      const listDiv = document.getElementById('recordsList');
      listDiv.innerHTML = "";

      registrosData.slice().reverse().forEach((reg, indexOriginal) => {
        const index = registrosData.length - 1 - indexOriginal;
        const lat = normalizarCoordenada(reg.latitud);
        const lng = normalizarCoordenada(reg.longitud);

        const card = document.createElement('div');
        card.className = "record-card";
        card.id = `card-${index}`;
        card.onclick = () => seleccionarRegistro(index);

        card.innerHTML = `
          <div class="record-id">${reg.id}</div>
          <div class="record-time">⏱ ${reg.timestamp_captura || 'Sin fecha'}</div>
          <div class="record-coords">📍 Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}</div>
          ${reg.url_foto ? '<span style="font-size:0.7rem; color:#00ff66;">📷 Con fotografía</span>' : ''}
        `;
        listDiv.appendChild(card);
      });
    }

    function renderizarMapa() {
      markersGroup.clearLayers();

      registrosData.forEach((reg, index) => {
        const lat = normalizarCoordenada(reg.latitud);
        const lng = normalizarCoordenada(reg.longitud);

        if (!isNaN(lat) && !isNaN(lng) && lat !== 0) {
          const marker = L.circleMarker([lat, lng], {
            radius: 8, fillColor: "#00ff66", color: "#050b14", weight: 2, opacity: 1, fillOpacity: 0.85
          });

          marker.on('click', () => seleccionarRegistro(index));
          markersGroup.addLayer(marker);
        }
      });

      if (registrosData.length > 0) {
        const ultimaPos = registrosData[registrosData.length - 1];
        const primeraLat = normalizarCoordenada(ultimaPos.latitud);
        const primeraLng = normalizarCoordenada(ultimaPos.longitud);
        if (!isNaN(primeraLat)) map.setView([primeraLat, primeraLng], 14);
      }
    }

    function seleccionarRegistro(index) {
      document.querySelectorAll('.record-card').forEach(c => c.classList.remove('active'));
      const activeCard = document.getElementById(`card-${index}`);
      if (activeCard) activeCard.classList.add('active');

      const reg = registrosData[index];
      const lat = normalizarCoordenada(reg.latitud);
      const lng = normalizarCoordenada(reg.longitud);

      if (!isNaN(lat) && !isNaN(lng)) {
        map.flyTo([lat, lng], 16, { duration: 1 });
      }

      const photoPanel = document.getElementById('photoPanel');
      if (reg.id_foto_drive || reg.url_foto) {
        const fileId = reg.id_foto_drive || (reg.url_foto.match(/\/d\/([^\/]+)/) || [])[1];
        if (fileId) {
          document.getElementById('photoImg').src = `https://drive.google.com/thumbnail?id=${fileId}&sz=w800`;
          document.getElementById('photoLink').href = reg.url_foto || `https://drive.google.com/file/d/${fileId}/view`;
          document.getElementById('photoTitle').textContent = `FOTO // ${reg.id}`;
          photoPanel.style.display = 'block';
        }
      } else {
        photoPanel.style.display = 'none';
      }
    }

    function cerrarFoto() {
      document.getElementById('photoPanel').style.display = 'none';
    }

    window.onload = () => {
      initMap();
      cargarDatos();
    };
  </script>
</body>
</html>
